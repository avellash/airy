
name: airy
description: A Flutter application for monitoring air quality.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Mengambil data dari Open-Meteo API
  http: ^1.2.2

  # State management menggunakan Provider
  provider: ^6.1.2

  # Icon bawaan Flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.6.0

  # Pengujian HTTP tanpa request API sungguhan
  # MockClient tersedia melalui package http
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
